name: flutter_application_1
description: "A new Flutter project."
# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish it

# The following defines the version and build number for your application.
# A version number is three numbers separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about Android versioning at https://developer.android.com/tools/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your application needs in order to work.
# To automatically upgrade the package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# run `flutter pub outdated` to see which dependencies have newer versions available.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Permission dan deteksi lokasi GPS SKANOVA
  permission_handler: ^13.0.2
  location: ^10.2.0

  # Kamera dan penyimpanan presensi SKANOVA
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set is activated in the
  # analysis_options.yaml file located at the root of your package.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included in the application.
  uses-material-design: true

  # Logo aplikasi SKANOVA
  assets:
    - assets/logo.png

  # To add custom fonts to your application, see:
  # https://flutter.dev/to/font-from-package
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700